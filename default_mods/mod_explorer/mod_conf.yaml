mod:
  name: "mod_explorer"
  title: "Mods"
  version: "0.1.0"
  api: "^0.1.0"
  description: "Lists mods and opens them in the mod viewer."
  entrypoint: "./main.js"
  test_path: "./test.js"
  config:
    viewer: "mod_viewer"
    mods:
      - "./samples/mods/book_list"
      - "./samples/mods/flashcards"
  permissions:
    open:
      - host: "*"
        reason: "Opens the mods you pick"
