# A fixture mod for the viewer's tests (test/viewer_cases.ts), which only inspect it: it has no code, and its default mosaic is never opened.
mod:
  title: "Listed Mod"
  version: "1.0.0"
  api: "^0.1.0"
  description: "A fixture mod that the viewer's tests show."
  entrypoint: "./main.js"
  default_mosaic: "./mosaic.yaml"
  config:
    show_covers: true
    shelves:
      - "fiction"
  permissions:
    show:
      - host: "https://covers.example.org"
        reason: "Shows the covers"
