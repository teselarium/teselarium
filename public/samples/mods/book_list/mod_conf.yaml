mod:
  name: "book_list"
  title: "Book List"
  version: "1.0.0"
  api: "^0.1.0"
  description: "A very simple list of books with their covers."
  entrypoint: "./main.js"
  type_path: "./book_type.md"
  sample_collection: "./book_collection.yaml"
  config:
    show_covers: true
  permissions:
    show:
      - host: "https://upload.wikimedia.org"
        reason: "Shows the book covers"
